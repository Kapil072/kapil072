<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Kapil Sen, Full-Stack and AI Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect y="294" width="1200" height="6" fill="url(#accent)"/>
  </g>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="72" y="98" font-size="20" font-weight="600" fill="#38bdf8" letter-spacing="4">HELLO, I'M</text>
    <text x="70" y="166" font-size="64" font-weight="800" fill="#f8fafc">Kapil Sen</text>
    <rect x="72" y="186" width="84" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="228" font-size="26" font-weight="500" fill="#cbd5e1">Full-Stack &amp; AI Developer</text>
    <text x="72" y="262" font-size="17" fill="#64748b" letter-spacing="1">LLMs  ·  RAG  ·  Computer Vision  ·  Web &amp; Mobile</text>
  </g>

  <!-- Code window decoration -->
  <g transform="translate(760 58)" font-family="Consolas, 'Courier New', monospace" font-size="15">
    <rect width="370" height="190" rx="12" fill="#0f172a" stroke="#1e293b"/>
    <rect width="370" height="34" rx="12" fill="#1e293b"/>
    <rect y="22" width="370" height="12" fill="#1e293b"/>
    <circle cx="20" cy="17" r="5" fill="#f87171"/>
    <circle cx="38" cy="17" r="5" fill="#fbbf24"/>
    <circle cx="56" cy="17" r="5" fill="#34d399"/>
    <text x="190" y="22" font-size="12" fill="#64748b" text-anchor="middle">kapil.py</text>
    <text x="22" y="66" fill="#c084fc">class <tspan fill="#38bdf8">Kapil</tspan><tspan fill="#e2e8f0">:</tspan></text>
    <text x="46" y="92" fill="#e2e8f0">role  = <tspan fill="#a3e635">"Full-Stack + AI"</tspan></text>
    <text x="46" y="116" fill="#e2e8f0">stack = [<tspan fill="#a3e635">"Next.js"</tspan>, <tspan fill="#a3e635">"FastAPI"</tspan>,</text>
    <text x="118" y="140" fill="#a3e635">"LangChain"<tspan fill="#e2e8f0">, </tspan>"Flutter"<tspan fill="#e2e8f0">]</tspan></text>
    <text x="46" y="164" fill="#e2e8f0">ship  = <tspan fill="#fbbf24">True</tspan></text>
  </g>
</svg>
